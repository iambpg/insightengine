# SNMP module and auth chosen for a device. The NetBox plugin reads this file
# (mounted at /etc/ie/module-map.yml) and publishes the result as
# __meta_netbox_snmp_module and __meta_netbox_snmp_auth. Prometheus relabel
# copies those onto the snmp_exporter query. A custom field snmp_module wins.
#
# by_role_platform is checked first (wireless-controller/ios-xe is a 9800,
# wireless-controller/aireos is AireOS). Then platform, manufacturer, role.
# Access points set skip_snmp: Prometheus drops them. Telegraf polls the WLC.
default_module: [if_mib, uptime]
default_auth: ntt_snmpv3_auth
by_role_platform:
  wireless-controller/aireos:
    modules: [if_mib, cisco_wlc_aireos, cisco_env, cisco_mem, cisco_pro, uptime]
    auth: ie_wlc_v2
  wireless-controller/ios-xe:
    modules: [if_mib, cisco_wlc_iosxe, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_env, cisco_mem, uptime]
    auth: ie_wlc_v2
  wireless-controller/iosxe:
    modules: [if_mib, cisco_wlc_iosxe, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_env, cisco_mem, uptime]
    auth: ie_wlc_v2
  cedge/ios-xe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  cedge/iosxe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  sdwan-edge/ios-xe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  wan-edge/ios-xe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
by_role:
  access-switch:
    modules: [if_mib, cisco_environ, cisco_mem, cisco_pro, cisco_cdp, lldp, uptime]
    auth: ntt_snmpv3_auth
  core-switch:
    modules: [if_mib, cisco_environ, cisco_mem, cisco_pro, cisco_cdp, lldp, uptime]
    auth: ntt_snmpv3_auth
  core-switches:
    modules: [if_mib, cisco_environ, cisco_mem, cisco_pro, cisco_cdp, lldp, uptime]
    auth: ntt_snmpv3_auth
  distribution-switch:
    modules: [if_mib, cisco_environ, cisco_mem, cisco_pro, system, cisco_cdp, lldp]
    auth: ie_snmp_v2
  sdwan:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
  hub:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
  core-firewall:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortigate_est_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
  wireless-controller:
    modules: [if_mib, cisco_wlc_aireos, cisco_env, cisco_mem, cisco_pro, uptime]
    auth: ie_wlc_v2
  # Cisco IOS-XE SD-WAN edge. Not the FortiGate role `sdwan`.
  cedge:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  sdwan-edge:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  wan-edge:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  access-point:
    skip_snmp: true
  ap:
    skip_snmp: true
  wireless-ap:
    skip_snmp: true
by_manufacturer:
  fortinet:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
  palo-alto:
    modules: [if_mib, paloalto_health, uptime]
    auth: ntt_snmpv3_auth
  paloalto:
    modules: [if_mib, paloalto_health, uptime]
    auth: ntt_snmpv3_auth
by_platform:
  ios:
    modules: [if_mib, cisco_env, cisco_mem, cisco_pro, cisco_cdp, lldp, cisco_rttmon, uptime]
    auth: ntt_snmpv3_auth
  ios-xe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, uptime]
    auth: ntt_snmpv3_auth
  iosxe:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, uptime]
    auth: ntt_snmpv3_auth
  ios-xe-sdwan:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_pro, cisco_cdp, lldp, cisco_env, cisco_mem, cisco_rttmon, cisco_sdwan_bfd, uptime]
    auth: ntt_snmpv3_auth
  nx-os:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_cdp, lldp, cisco_mem, uptime]
    auth: ntt_snmpv3_auth
  nxos:
    modules: [if_mib, cisco_enhanced_mem, cisco_entity_sensor, cisco_fru, cisco_cdp, lldp, cisco_mem, uptime]
    auth: ntt_snmpv3_auth
  aireos:
    modules: [if_mib, cisco_wlc_aireos, cisco_env, cisco_mem, cisco_pro, uptime]
    auth: ie_wlc_v2
  asa:
    modules: [if_mib, cisco_env, cisco_mem, cisco_cdp, lldp, uptime]
    auth: ntt_snmpv3_auth
  pan-os:
    modules: [if_mib, paloalto_health, uptime]
    auth: ntt_snmpv3_auth
  panos:
    modules: [if_mib, paloalto_health, uptime]
    auth: ntt_snmpv3_auth
  fortigate:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
  fortios:
    modules: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortinet_health]
    auth: ntt_snmpv3_auth
