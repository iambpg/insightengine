# Docker/Compose secrets are files in /run/secrets/<name>.
# Reference them in other files as @{docker_secrets:<name>} - never paste a
# token or password into a .conf file.
[[secretstores.docker]]
  id = "docker_secrets"
  # drop-priv.sh copies /run/secrets here as mode 0400 for uid 10001.
  # The bind-mounted originals stay root-only.
  path = "/run/ie-secrets"
