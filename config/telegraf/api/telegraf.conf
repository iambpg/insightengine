# telegraf-api: API collection for firewalls / controllers (read-only creds).
# Vendor inputs live in telegraf.d/. Only *.conf files there are loaded; the
# *.conf.example files are templates (copy to .conf, fill in, restart).
# Prometheus scrapes this instance on :9273.
[global_tags]
  client = "${CLIENT_SLUG}"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  collection_jitter = "10s"
  flush_interval = "30s"
  precision = "0s"
  omit_hostname = true
  quiet = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "5m"       # series disappear if a device stops reporting
  collectors_exclude = ["gocollector", "process"]

[[inputs.internal]]
  collect_memstats = false
