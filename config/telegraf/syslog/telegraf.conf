# Receives syslog from network devices and stores it in Loki.
# Nothing in this file is an address, hostname, or vendor list for one site.
# Devices send to UDP or TCP 514 on whatever server this stack is installed on.
# ${CLIENT_SLUG} comes from that install's .env.
#
# Cisco IOS, FortiGate, and Palo Alto do not send the same text. The raw line
# is kept, and a short label is added when the line itself says which vendor
# and device it came from.

[global_tags]
  client = "${CLIENT_SLUG}"

[agent]
  interval = "30s"
  omit_hostname = true
  skip_processors_after_aggregators = false
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  flush_interval = "5s"
  quiet = true

[[inputs.socket_listener]]
  service_address = "udp://:6514"
  data_format = "value"
  data_type = "string"
  name_override = "syslog"
  read_buffer_size = "1MiB"

[[inputs.socket_listener]]
  service_address = "tcp://:6514"
  splitting_strategy = "newline"
  data_format = "value"
  data_type = "string"
  name_override = "syslog"
  max_connections = 0
  read_timeout = "0s"

[[inputs.internal]]
  collect_memstats = false

[[processors.starlark]]
  namepass = ["syslog"]
  source = '''
SEVERITY = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"]
MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

def apply(metric):
    raw = metric.fields.get("value")
    if raw == None:
        raw = metric.fields.get("message")
    if raw == None:
        return metric
    line = str(raw).strip(" \r\n")
    if line == "":
        return None
    sender, line = peel_sender(line)
    if line == "":
        return None
    pri, body = split_pri(line)
    host = ""
    vendor = ""
    devname = field(body, "devname")
    if devname == "":
        devname = field(body, "dvchost")
    if devname != "" or "|Fortinet|" in body:
        vendor = "fortinet"
        host = devname
    elif "|Palo Alto" in body:
        vendor = "paloalto"
        host = header_host(body)
        if not usable(host):
            host = field(body, "dvchost")
    elif palo(body):
        vendor = "paloalto"
        host = header_host(body)
    elif cisco(body):
        vendor = "cisco"
        host = header_host(body)
        if not usable(host):
            host = cisco_host(body)
    else:
        host = header_host(body)
    if sender != "":
        metric.tags["sender"] = sender
    if usable(host):
        metric.tags["hostname"] = host
    if vendor != "":
        metric.tags["vendor"] = vendor
    if pri >= 0:
        metric.tags["severity"] = SEVERITY[pri % 8]
    metric.fields["message"] = line
    if "value" in metric.fields:
        metric.fields.pop("value")
    for key in ["source", "appname", "procid", "msgid", "version", "facility"]:
        if key in metric.tags:
            metric.tags.pop(key)
    return metric

def split_pri(line):
    if len(line) < 4 or line[0] != "<":
        return -1, line
    end = line.find(">")
    if end < 2 or end > 6:
        return -1, line
    digits = line[1:end]
    if not digits.isdigit():
        return -1, line
    return int(digits), line[end + 1:]

def usable(name):
    if name == None or name == "" or name == "-":
        return False
    if name[0] in "0123456789<%":
        return False
    if "," in name or "=" in name or ":" in name:
        return False
    if name in ["SAST", "UTC", "GMT", "CAT", "EST", "EDT", "CST", "CDT", "MST", "MDT", "PST", "PDT", "CET", "CEST", "WAT", "EAT", "IST", "JST", "BST"]:
        return False
    return True

def peel_sender(line):
    if len(line) < 8 or line[0] != "@":
        return "", line
    space = line.find(" ")
    if space < 8 or space > 46:
        return "", line
    ip = line[1:space]
    parts = ip.split(".")
    if len(parts) != 4:
        return "", line
    for part in parts:
        if not part.isdigit() or int(part) > 255:
            return "", line
    return ip, line[space + 1:]

def field(text, name):
    key = name + "="
    at = text.find(key)
    if at < 0:
        return ""
    rest = text[at + len(key):]
    if rest.startswith('"'):
        end = rest.find('"', 1)
        if end < 0:
            return ""
        return rest[1:end]
    end = rest.find(" ")
    if end < 0:
        return rest
    return rest[:end]

def palo(text):
    kinds = [",TRAFFIC,", ",THREAT,", ",SYSTEM,", ",CONFIG,", ",HIPMATCH,", ",GLOBALPROTECT,", ",USERID,", ",DECRYPTION,", ",WILDFIRE,"]
    for kind in kinds:
        if kind in text:
            return True
    return False

def cisco(text):
    at = text.find("%")
    if at < 0:
        return False
    token = text[at + 1:]
    dash = token.find("-")
    if dash <= 0:
        return False
    rest = token[dash + 1:]
    if len(rest) < 3 or rest[1] != "-":
        return False
    return rest[0] in "01234567"

def header_host(body):
    parts = body.split(" ")
    if len(parts) >= 3 and parts[0] == "1" and len(parts[1]) > 4 and parts[1][4] == "-":
        return parts[2]
    if len(parts) >= 4 and parts[0] in MONTHS and ":" in parts[2]:
        return parts[3]
    return ""

def cisco_host(text):
    at = text.find("%")
    if at <= 0:
        return ""
    before = text[:at].strip(" :")
    if before == "":
        return ""
    parts = before.split(" ")
    return parts[-1]
'''

[[outputs.loki]]
  namepass = ["syslog"]
  domain = "http://loki:3100"
  endpoint = "/loki/api/v1/push"
  timeout = "10s"
  metric_name_label = "source"

[[outputs.prometheus_client]]
  namepass = ["internal*"]
  listen = ":9273"
  metric_version = 2
