# telegraf-syslog: receives syslog (UDP+TCP 6514 inside, published on host 514)
# and ships it to Loki. Chosen over Promtail (end-of-life 2026-03-02) because
# Telegraf is already part of the stack; Grafana Alloy is the other option.
#
# Labels sent to Loki = Telegraf tags. Low-cardinality ones are kept
# (hostname, severity, facility, client); the rest go into the log line.
[global_tags]
  client = "${CLIENT_SLUG}"

[agent]
  interval = "30s"
  omit_hostname = true
  metric_batch_size = 5000
  metric_buffer_limit = 200000      # ESTIMATE: absorbs a short Loki outage
  flush_interval = "5s"
  quiet = true

[[inputs.syslog]]
  server = "udp://:6514"
  syslog_standard = "RFC3164"
  best_effort = true
[[inputs.syslog]]
  server = "tcp://:6514"
  syslog_standard = "RFC3164"
  best_effort = true

[[inputs.internal]]
  collect_memstats = false

[[processors.converter]]
  namepass = ["syslog"]
  [processors.converter.tags]
    string = ["appname", "procid", "msgid", "version"]

[[outputs.loki]]
  namepass = ["syslog"]
  domain = "http://loki:3100"
  endpoint = "/loki/api/v1/push"
  timeout = "10s"
  metric_name_label = "source"

[[outputs.prometheus_client]]
  namepass = ["internal*"]
  listen = ":9273"
  metric_version = 2
