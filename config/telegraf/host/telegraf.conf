# telegraf-host: metrics about THIS monitoring server and its containers.
[global_tags]
  client = "${CLIENT_SLUG}"

[agent]
  interval = "30s"
  round_interval = true
  omit_hostname = false
  quiet = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "2m"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.processes]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]
[[inputs.diskio]]
[[inputs.net]]
# Container stats via the (read-only) Docker socket - see SECURITY note in
# docker-compose.yml. Remove this block and the socket mount to drop that access.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  perdevice_include = ["cpu"]
  total_include = ["cpu", "blkio", "network"]
  gather_services = false
  container_name_include = []
  timeout = "10s"
