# SNMP and gNMI inputs rendered from NetBox. Restarted on its own when that
# list changes. Dial-out stays in the other Telegraf process.
[agent]
  interval = "60s"
  round_interval = false
  omit_hostname = true
  quiet = true
  flush_interval = "10s"
  metric_batch_size = 10000
  metric_buffer_limit = 100000

[[outputs.socket_writer]]
  address = "tcp://127.0.0.1:9274"
  data_format = "influx"
  namepass = ["ie_wlc_*", "ie_sdwan_*"]

[[inputs.internal]]
  collect_memstats = false
