# telegraf-wlc: per-AP tables polled from wireless controllers.
# Generated inputs are added at start from NetBox (render_wlc.py).
# Prometheus scrapes :9273. That scrape is not the SNMP walk.
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 10000
  metric_buffer_limit = 200000
  collection_jitter = "5s"
  flush_interval = "30s"
  precision = "0s"
  omit_hostname = true
  quiet = true
  skip_processors_after_aggregators = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # Radio tables are collected every 10m. Keep series across that gap.
  expiration_interval = "20m"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true

[global_tags]
  client = "${CLIENT_SLUG}"
  collector = "telegraf-wlc"

# 9800 MDT client rows are stored per client unless store_clients is "0".
# AireOS SNMP does not send client rows. Rollups per AP, radio and SSID
# are always written. See normalize.star.
[[processors.starlark]]
  namepass = ["*"]
  script = "/etc/telegraf/normalize.star"
