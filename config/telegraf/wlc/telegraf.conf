# telegraf-wlc: per-AP tables polled from wireless controllers.
# Generated inputs are added at start from NetBox (render_wlc.py).
# Prometheus scrapes :9273. That scrape is not the SNMP walk.
[agent]
  interval = "60s"
  round_interval = true
  # Smaller batches so a fat MDT push is not held twice (agent buffer
  # and the prometheus client). 40000 is several flushes of a 5000-AP
  # controller after history rows are collapsed, without the old 200000 cap.
  metric_batch_size = 5000
  metric_buffer_limit = 40000
  collection_jitter = "5s"
  flush_interval = "30s"
  precision = "0s"
  omit_hostname = true
  quiet = true
  skip_processors_after_aggregators = true

# Client-oper rows are forwarded before normalize.star. HTTP, not a
# dial-out socket: a refused connection does not stop this process.
# 30s and 5000-row gzip bodies so the listener can answer before the
# client gives up. 10000 is one client-oper update (~9000 rows) plus a
# little, about 40MB if a row is 4KB, then the writer drops. A stuck
# clients process cannot fill the 6g cgroup.
[[outputs.http]]
  alias = "wlc-clients"
  url = "http://${IE_WLC_CLIENTS_FORWARD:-telegraf-wlc-clients:9276}/telegraf"
  data_format = "influx"
  method = "POST"
  timeout = "30s"
  content_encoding = "gzip"
  metric_batch_size = 5000
  metric_buffer_limit = 10000
  namepass = [
    "ie_wlc_client_common",
    "ie_wlc_client_dot11",
    "ie_wlc_client_raw",
    "ie_wlc_client_mobility",
    "ie_wlc_client_policy",
  ]

# Radio and RRM are normalized in telegraf-wlc-radio. 20000 rows is one
# 4,600-AP push (two radios, oper and RRM) at about 4KB each, ~80MB, and
# then the writer drops. 50000 of the raw RRM rows was enough to sit in
# memory while every 5s post timed out.
[[outputs.http]]
  alias = "wlc-radio"
  url = "http://${IE_WLC_RADIO_FORWARD:-telegraf-wlc-radio:9277}/telegraf"
  data_format = "influx"
  method = "POST"
  timeout = "30s"
  content_encoding = "gzip"
  metric_batch_size = 5000
  metric_buffer_limit = 20000
  namepass = [
    "ie_wlc_radio_mdt",
    "ie_wlc_radio_stats",
    "ie_wlc_rrm",
    "ie_wlc_rrm_slot",
  ]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # Longest MDT subscription is 600s (capwap inventory and hardware).
  # Two missed intervals and the series is stale. 1200s is that window.
  expiration_interval = "1200s"
  collectors_exclude = ["gocollector", "process"]
  # AireOS SNMP metrics still return their original fields, so this stays
  # on for that path. 9800 counters do not copy string leaves into fields,
  # so a MAC or timestamp is not a label on those series.
  string_as_label = true
  namedrop = [
    "ie_wlc_client_common",
    "ie_wlc_client_dot11",
    "ie_wlc_client_raw",
    "ie_wlc_client_mobility",
    "ie_wlc_client_policy",
    "ie_wlc_radio_mdt",
    "ie_wlc_radio_stats",
    "ie_wlc_rrm",
    "ie_wlc_rrm_slot",
  ]
  # Inventory strings (model, IOS, serial, IP, location) are tags on
  # ie_wlc_ap field "info", so Prometheus exports ie_wlc_ap_info. A string
  # field that is not a label is omitted from this output.

[global_tags]
  client = "${CLIENT_SLUG}"
  collector = "telegraf-wlc"

# Client-oper is retagged, then skipped by normalize.star, then written to
# telegraf-wlc-clients. Radio and RRM are skipped the same way and written
# to telegraf-wlc-radio. This process keeps AP inventory and controller series.
# AireOS SNMP does not send client rows.
# Generated NetBox inputs are collected by a second Telegraf process and
# pushed here. That process is the one restarted when the controller list
# changes. This listener, and the dial-out input, are not reloaded.
[[inputs.socket_listener]]
  service_address = "tcp://127.0.0.1:9274"
  data_format = "influx"
  read_buffer_size = "1MiB"

# Forward backlog. internal_write_errors and internal_write_buffer_size
# are tagged with the output alias (wlc-clients, wlc-radio). Memory stats
# are off so this does not add a second scrape of the Go heap.
[[inputs.internal]]
  collect_memstats = false
  collect_gostats = false
  per_instance = true
  namepass = ["internal_write"]

[[processors.starlark]]
  namepass = [
    "ie_wlc_client_common",
    "ie_wlc_client_dot11",
    "ie_wlc_client_raw",
    "ie_wlc_client_mobility",
    "ie_wlc_client_policy",
  ]
  script = "/etc/telegraf/client_forward.star"

[[processors.starlark]]
  namedrop = [
    "ie_wlc_client_common",
    "ie_wlc_client_dot11",
    "ie_wlc_client_raw",
    "ie_wlc_client_mobility",
    "ie_wlc_client_policy",
    "ie_wlc_radio_mdt",
    "ie_wlc_radio_stats",
    "ie_wlc_rrm",
    "ie_wlc_rrm_slot",
    "internal_write",
  ]
  script = "/etc/telegraf/normalize.star"
