# telegraf-wlc-radio: radio oper, radio stats and RRM only.
# Prometheus scrapes :9273 on this container (job telegraf-wlc-radio).
# AP inventory and controller series stay on telegraf-wlc.
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 40000
  collection_jitter = "5s"
  flush_interval = "30s"
  precision = "0s"
  omit_hostname = true
  quiet = true
  skip_processors_after_aggregators = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # Radio and RRM subscriptions are 120s. 1200s matches the AP collector
  # so a missed push does not drop channel util before the next scrape.
  expiration_interval = "1200s"
  collectors_exclude = ["gocollector", "process"]
  # Labels are wlc, site, ap, radio and band. String fields are not labels.

[global_tags]
  client = "${CLIENT_SLUG}"
  collector = "telegraf-wlc-radio"

# telegraf-wlc POSTs radio and RRM here. Docker DNS only. Not a host port.
[[inputs.http_listener_v2]]
  service_address = "tcp://:9277"
  paths = ["/telegraf"]
  data_format = "influx"
  max_body_size = "32MB"

[[processors.starlark]]
  namepass = ["*"]
  script = "/etc/telegraf/normalize.star"
