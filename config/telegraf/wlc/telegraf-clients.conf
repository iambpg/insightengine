# telegraf-wlc-clients: per-client MDT only.
# Prometheus scrapes :9273 on this container (job telegraf-wlc-clients).
# AP, radio and controller series stay in telegraf-wlc.
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 40000
  collection_jitter = "5s"
  flush_interval = "30s"
  precision = "0s"
  omit_hostname = true
  quiet = true
  skip_processors_after_aggregators = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # Client subscriptions are 60s. 300s drops a client that roamed or left
  # instead of keeping the old series for the AP collector's 1200s window.
  expiration_interval = "300s"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  # ie_wlc_client labels are wlc, ap, ssid, band and the client MAC.
  # Rollups (ie_wlc_client_radio, ie_wlc_ssid) are computed from the same
  # dial-out, so WifiRssiLow still sees them on this job.

[global_tags]
  client = "${CLIENT_SLUG}"
  collector = "telegraf-wlc-clients"

# gNMI client subscriptions, when IE_WLC_MDT_TRANSPORT=gnmi, arrive from the
# poller on this socket. Dial-out does not use it.
[[inputs.socket_listener]]
  service_address = "tcp://127.0.0.1:9274"
  data_format = "influx"
  read_buffer_size = "1MiB"

[[processors.starlark]]
  namepass = ["*"]
  script = "/etc/telegraf/normalize.star"
