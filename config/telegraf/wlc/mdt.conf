# gRPC dial-out listener. Catalyst 9800 and IOS-XE cEdge push here.
# gNMI dial-in is rendered per controller instead (IE_WLC_MDT_TRANSPORT=gnmi).
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"
  max_msg_size = 8000000
  [inputs.cisco_telemetry_mdt.tags]
    store_clients = "${IE_WLC_STORE_CLIENTS}"
  [inputs.cisco_telemetry_mdt.aliases]
    ie_wlc_client_raw = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats"
    ie_wlc_client_common = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/common-oper-data"
    ie_wlc_rrm = "Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement"
    ie_wlc_ap_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/capwap-data"
    ie_wlc_radio_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data"
    ie_wlc_ssid = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ssid-counters"
    ie_sdwan_bfd = "Cisco-IOS-XE-sdwan-oper:sdwan-oper-data/bfd/sessions"
    ie_sdwan_approute = "Cisco-IOS-XE-sdwan-oper:sdwan-oper-data/app-route/statistics"
