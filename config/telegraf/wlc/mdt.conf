# gRPC dial-out listener. Catalyst 9800 and IOS-XE cEdge push here.
# gNMI dial-in is rendered per controller instead (IE_WLC_MDT_TRANSPORT=gnmi).
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  # IE_MDT_PORT defaults to 57500 (entrypoint and compose). Not 57400 (UI HTTPS).
  service_address = ":${IE_MDT_PORT}"
  max_msg_size = 16000000
  [inputs.cisco_telemetry_mdt.tags]
    # Default is store. IE_WLC_STORE_CLIENTS=0 drops per-client Prometheus series.
    store_clients = "${IE_WLC_STORE_CLIENTS}"
  [inputs.cisco_telemetry_mdt.aliases]
    ie_wlc_ap_name_map = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ap-name-mac-map"
    ie_wlc_ap_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/capwap-data"
    ie_wlc_radio_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data"
    ie_wlc_radio_stats = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-stats"
    ie_wlc_ethernet = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ethernet-if-stats"
    ie_wlc_cdp_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/cdp-cache-data"
    ie_wlc_lldp_mdt = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/lldp-neigh"
    ie_wlc_ssid = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ssid-counters"
    ie_wlc_capwap_pkts = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/capwap-pkts"
    ie_wlc_ap_image_prepare = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ap-image-prepare-location"
    ie_wlc_ap_image_predownload = "Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/predownload-data"
    ie_wlc_rrm = "Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement"
    ie_wlc_rrm_slot = "Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/radio-slot"
    ie_wlc_client_common = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/common-oper-data"
    ie_wlc_client_dot11 = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data"
    ie_wlc_client_raw = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats"
    ie_wlc_client_mobility = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/mobility-oper-data"
    ie_wlc_client_policy = "Cisco-IOS-XE-wireless-client-oper:client-oper-data/policy-data"
    ie_wlc_ap_global_stats = "Cisco-IOS-XE-wireless-ap-global-oper:ap-global-oper-data/ewlc-ap-stats"
    ie_wlc_ap_join = "Cisco-IOS-XE-wireless-ap-global-oper:ap-global-oper-data/ap-join-stats"
    ie_wlc_ap_history = "Cisco-IOS-XE-wireless-ap-global-oper:ap-global-oper-data/ap-history"
    ie_wlc_join_count = "Cisco-IOS-XE-wireless-ap-global-oper:ap-global-oper-data/emltd-join-count-stat"
    ie_wlc_wlan_clients = "Cisco-IOS-XE-wireless-ap-global-oper:ap-global-oper-data/wlan-client-stats"
    ie_wlc_wlan_info = "Cisco-IOS-XE-wireless-wlan-global-oper:wlan-global-oper-data/wlan-info"
    ie_wlc_mobility = "Cisco-IOS-XE-wireless-mobility-oper:mobility-oper-data/mobility-global-stats"
    ie_wlc_rogue_mdt = "Cisco-IOS-XE-wireless-rogue-oper:rogue-oper-data/rogue-stats"
    ie_wlc_ha = "Cisco-IOS-XE-ha-oper:ha-oper-data/ha-infra"
    ie_wlc_cpu = "Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization"
    ie_wlc_memory = "Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic"
    ie_wlc_env = "Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor"
    ie_wlc_platform = "Cisco-IOS-XE-platform-software-oper:cisco-platform-software/system-usages"
    ie_wlc_interface = "Cisco-IOS-XE-interfaces-oper:interfaces/interface"
    ie_wlc_hardware = "Cisco-IOS-XE-device-hardware-oper:device-hardware-data/device-hardware"
