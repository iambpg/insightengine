# Device discovery matches the real stack's NetBox plugin
# (/api/plugins/lists/prometheus-devices/), reached through the internal Caddy
# listener so TLS is checked with the CA mounted at /etc/ie-certs/ca.crt
# (not under the read-only /etc/prometheus tree). Refresh is 5m, so a new active
# device with a primary IP shows up within the 5-10 minute window.
# Module and auth come from the job, then from __meta_netbox_snmp_* when the
# plugin set them (role / manufacturer / platform).
global:
  scrape_interval: 60s
  scrape_timeout: 30s
  evaluation_interval: 60s
  external_labels:
    client: ${CLIENT_SLUG}
    client_name: ${CLIENT_NAME}

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: alertmanager
    static_configs: [{targets: ['alertmanager:9093']}]
  - job_name: snmp-exporter
    static_configs: [{targets: ['snmp-exporter-1:9116', 'snmp-exporter-2:9116']}]
  - job_name: blackbox-exporter
    static_configs: [{targets: ['blackbox-exporter-1:9115', 'blackbox-exporter-2:9115']}]
  - job_name: telegraf-api
    static_configs: [{targets: ['telegraf-api:9273']}]
  - job_name: telegraf-host
    static_configs: [{targets: ['telegraf-host:9273']}]
  - job_name: telegraf-syslog
    static_configs: [{targets: ['telegraf-syslog:9273']}]
  - job_name: netbox
    metrics_path: /metrics
    static_configs: [{targets: ['netbox:8080']}]
    params:
      format: [prometheus]
  - job_name: loki
    static_configs: [{targets: ['loki:3100']}]

  - job_name: icmp-access-switches
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - &netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=access-switch
        refresh_interval: 5m
        authorization:
          # NetBox 4.6 v2 tokens (nbt_<key>.<secret>) require the Bearer scheme.
          type: Bearer
          credentials_file: /run/secrets/netbox_token
        tls_config:
          ca_file: /etc/ie-certs/ca.crt
          server_name: caddy
    relabel_configs: &icmp_relabels
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_netbox_name]
        target_label: hostname
      - source_labels: [__meta_netbox_site_name]
        target_label: site
      - source_labels: [__meta_netbox_role]
        target_label: device_role
      - source_labels: [__meta_netbox_device_type]
        target_label: model
      - source_labels: [__meta_netbox_region]
        target_label: region
      - source_labels: [__meta_netbox_primary_ip4]
        target_label: ipv4
      - source_labels: [__meta_netbox_tenant]
        target_label: business_unit
      - source_labels: [__meta_netbox_site_group]
        target_label: site_type
      - target_label: __address__
        replacement: scrape-lb:9115

  - job_name: icmp-core-switches
    scrape_interval: 15s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=core-switch
    relabel_configs: *icmp_relabels

  - job_name: icmp-distribution-switches
    scrape_interval: 15s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=distribution-switch
    relabel_configs: *icmp_relabels

  - job_name: icmp-fortigate-sdwan-devices
    scrape_interval: 15s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=sdwan
    relabel_configs: *icmp_relabels

  - job_name: icmp-fortigate-hub-devices
    scrape_interval: 15s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=hub
    relabel_configs: *icmp_relabels

  - job_name: icmp-8540-wlc
    scrape_interval: 15s
    scrape_timeout: 8s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=wireless-controller
    relabel_configs: *icmp_relabels

  - job_name: icmp-other
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active
    relabel_configs:
      - source_labels: [__meta_netbox_role]
        regex: access-switch|core-switch|distribution-switch|sdwan|hub|wireless-controller|core-firewall
        action: drop
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_netbox_name]
        target_label: hostname
      - source_labels: [__meta_netbox_role]
        target_label: device_role
      - source_labels: [__meta_netbox_site_name]
        target_label: site
      - target_label: __address__
        replacement: scrape-lb:9115

  - job_name: snmp-access-switches
    scrape_interval: 60s
    scrape_timeout: 45s
    sample_limit: 20000
    metrics_path: /snmp
    params:
      module: [if_mib, cisco_environ, cisco_mem, cisco_pro]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=access-switch
    relabel_configs: &snmp_relabels
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_netbox_name]
        target_label: hostname
      - source_labels: [__meta_netbox_site_name]
        target_label: site
      - source_labels: [__meta_netbox_role]
        target_label: device_role
      - source_labels: [__meta_netbox_device_type]
        target_label: model
      - source_labels: [__meta_netbox_region]
        target_label: region
      - source_labels: [__meta_netbox_primary_ip4]
        target_label: ipv4
      - source_labels: [__meta_netbox_tenant]
        target_label: business_unit
      - source_labels: [__meta_netbox_site_group]
        target_label: site_type
      - source_labels: [__meta_netbox_platform]
        target_label: platform
      - source_labels: [__meta_netbox_manufacturer]
        target_label: manufacturer
      - source_labels: [__meta_netbox_snmp_module]
        regex: (.+)
        target_label: __param_module
      - source_labels: [__meta_netbox_snmp_auth]
        regex: (.+)
        target_label: __param_auth
      - target_label: __address__
        replacement: scrape-lb:9116

  - job_name: snmp-core-switches
    scrape_interval: 60s
    scrape_timeout: 45s
    sample_limit: 50000
    metrics_path: /snmp
    params:
      module: [if_mib, cisco_environ, cisco_mem, cisco_pro]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=core-switch
    relabel_configs: *snmp_relabels

  - job_name: snmp-distribution-switches
    scrape_interval: 60s
    scrape_timeout: 45s
    sample_limit: 50000
    metrics_path: /snmp
    params:
      module: [if_mib, cisco_environ, cisco_mem, cisco_pro, system]
      auth: [ie_snmp_v2]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=distribution-switch
    relabel_configs: *snmp_relabels

  - job_name: snmp-fortigate-sdwan-devices
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /snmp
    params:
      module: [if_mib_fortigate, fortigate, fortigate_bandwidth]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=sdwan
    relabel_configs: *snmp_relabels

  - job_name: snmp-fortigate-hub-devices
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /snmp
    params:
      module: [if_mib_fortigate, fortigate, fortigate_bandwidth]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=hub
    relabel_configs: *snmp_relabels

  - job_name: snmp-fortigate-core-fw-devices
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /snmp
    params:
      module: [if_mib_fortigate, fortigate, fortigate_bandwidth, fortigate_est_bandwidth]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=core-firewall
    relabel_configs: *snmp_relabels

  - job_name: snmp-cisco-wlc
    scrape_interval: 120s
    scrape_timeout: 110s
    sample_limit: 500000
    metrics_path: /snmp
    params:
      module: [cisco_wlc_universal]
      auth: [ie_wlc_v2]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active&role=wireless-controller
    relabel_configs: *snmp_relabels

  - job_name: snmp-other
    scrape_interval: 120s
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [ntt_snmpv3_auth]
    http_sd_configs:
      - <<: *netbox_sd
        url: https://caddy:8443/api/plugins/lists/prometheus-devices/?status=active
    relabel_configs:
      - source_labels: [__meta_netbox_role]
        regex: access-switch|core-switch|distribution-switch|sdwan|hub|wireless-controller|core-firewall
        action: drop
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_netbox_name]
        target_label: hostname
      - source_labels: [__meta_netbox_role]
        target_label: device_role
      - source_labels: [__meta_netbox_snmp_module]
        regex: (.+)
        target_label: __param_module
      - source_labels: [__meta_netbox_snmp_auth]
        regex: (.+)
        target_label: __param_auth
      - target_label: __address__
        replacement: scrape-lb:9116
