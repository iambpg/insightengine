# Insights Engine Network Monitoring Platform — Kernel Hardening
# Per Section 7 of Security Architecture Document

# Reverse path filtering
net.ipv4.conf.all.rp_filter = 1

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0

# Disable broadcast ICMP responses
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Kernel pointer restriction (maximum)
kernel.kptr_restrict = 2

# Restrict dmesg access
kernel.dmesg_restrict = 1

# Disable core dumps
fs.suid_dumpable = 0

# IP forwarding (required for Docker networking)
net.ipv4.ip_forward = 1
