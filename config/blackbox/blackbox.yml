modules:
  icmp:
    prober: icmp
    timeout: 15s
    icmp:
      preferred_ip_protocol: ip4
      dont_fragment: false
      payload_size: 56
  icmp_ttl5:
    prober: icmp
    timeout: 15s
    icmp:
      preferred_ip_protocol: ip4
      ttl: 5
      dont_fragment: false
      payload_size: 56
  icmp_custom:
    prober: icmp
    timeout: 15s
    icmp:
      preferred_ip_protocol: ip4
      dont_fragment: false
      payload_size: 56
  tcp_connect:
    prober: tcp
    timeout: 5s
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
