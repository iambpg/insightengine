<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>InsightEngine</title></head>
<body>
<h1>InsightEngine</h1>
<p>Reference copy of the setup redirect. It is not what Caddy serves. The UI is the Next.js app in ui/, built by ./install.sh. ui/placeholder/ is the nginx fallback only when ui/Dockerfile is absent.</p>
<p id="s"></p>
<script>
// UI CONTRACT (see docs/setup-api.md): on load, ask the setup service for the state and
// go to /setup/ unless it is "complete". Caddy already enforces this server-side.
fetch('/setup/state',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  if (j.state !== 'complete') { location.replace('/setup/'); }
  else { document.getElementById('s').textContent = 'Setup state: complete.'; }
}).catch(function(){ document.getElementById('s').textContent = 'Could not read setup state.'; });
</script>
</body></html>
