<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>InsightEngine</title></head>
<body>
<h1>InsightEngine</h1>
<p>Placeholder page. This nginx image is used only when ui/Dockerfile is missing. The product UI is the Next.js app in this directory, built by ./install.sh from one git clone.</p>
<p id="s"></p>
<script>
fetch('/setup/state',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  if (j.state !== 'complete') { location.replace('/setup/'); }
  else { document.getElementById('s').textContent = 'Setup state: complete.'; }
}).catch(function(){ document.getElementById('s').textContent = 'Could not read setup state.'; });
</script>
</body></html>
