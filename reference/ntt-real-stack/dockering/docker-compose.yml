networks:
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24

volumes:
  prom-data:
    driver: local
  snmp-ex-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-storage:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  netbox-postgres-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-media-data:
    driver: local
  netbox-reports-data:
    driver: local
  netbox-scripts-data:
    driver: local
  shared-postgres-data:
    driver: local
  activepieces-redis-data:
    driver: local
  activepieces-cache:
    driver: local

services:
  # ============================================
  # CADDY REVERSE PROXY (Port-based routing)
  # ============================================
  caddy:
    image: caddy:2.11.2-alpine
    container_name: caddy-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
      - "9090:9090"   # Prometheus
      - "3000:3000"   # Grafana
      - "9093:9093"   # Alertmanager
      - "8080:8080"   # Netbox
      - "9116:9116"   # SNMP Exporter
      - "9115:9115"   # Blackbox Exporter
      - "5678:5678"   # Activepieces
    networks:
      - monitoring-net
    environment:
      - CADDY_INGRESS_NETWORKS=monitoring-net
    volumes:
      - /opt/ie/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ie/caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      prometheus-ntt:
        condition: service_started
      grafana-ntt:
        condition: service_started
      alertmanager-ntt:
        condition: service_started
      netbox-ntt:
        condition: service_started
      blackbox-exporter-ntt:
        condition: service_started
      snmp-exporter-ntt:
        condition: service_started
      activepieces-ntt:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================
  # PROMETHEUS
  # ============================================
  prometheus-ntt:
    image: prom/prometheus:v3.11.3
    container_name: prometheus-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net

    volumes:
      - /opt/ie/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/ie/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - /opt/ie/prometheus/ie_switches_shard_1.json:/etc/prometheus/ie_switches_shard_1.json:ro
      - prom-data:/prometheus
      - /opt/ie/prometheus/netbox.token:/etc/prometheus/netbox.token:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://${HOST_IP:-localhost}:9090'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================
  # SNMP EXPORTER
  # ============================================
  snmp-exporter-ntt:
    image: prom/snmp-exporter:v0.30.1
    container_name: snmp-exporter-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - monitoring-net

    volumes:
      - /opt/ie/snmp-exporter:/etc/snmp_exporter:ro
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
      - '--config.expand-environment-variables'
    environment:
      - SNMP_V3_USERNAME=${SNMP_V3_USERNAME}
      - SNMP_V3_AUTH_PASSWORD=${SNMP_V3_AUTH_PASSWORD}
      - SNMP_V3_PRIV_PASSWORD=${SNMP_V3_PRIV_PASSWORD}
      - SNMP_V2_COMMUNITY=${SNMP_V2_COMMUNITY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9116/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # BLACKBOX EXPORTER
  # ============================================
  blackbox-exporter-ntt:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter-ntt
    restart: unless-stopped  
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    networks:
      - monitoring-net
 #   ports:
 #     - "9115:9115"  # Expose for Caddy to proxy
    volumes:
      - /opt/ie/blackbox-exporter/blackbox-config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--log.level=info'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================
  # TELEGRAF
  # ============================================
  telegraf-ntt:
    image: telegraf:1.38.3
    container_name: telegraf-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    group_add:
      - "988"
    networks:
      - monitoring-net
    volumes:
      - /opt/ie/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro 
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro  # Added for host metrics
      - /sys:/host/sys:ro    # Added for host metrics
      - /:/host:ro           # Added for host metrics
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_MOUNT_PREFIX=/host
      - TELEGRAF_PG_USER=${TELEGRAF_PG_USER}
      - TELEGRAF_PG_PASSWORD=${TELEGRAF_PG_PASSWORD}
      - TELEGRAF_PG_DB=${TELEGRAF_PG_DB}
      - FORTIGATE_API_TOKEN=${FORTIGATE_API_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9273/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # ALERTMANAGER
  # ============================================
  alertmanager-ntt:
    image: prom/alertmanager:v0.32.0
    container_name: alertmanager-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net

    volumes:
      - /opt/ie/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /opt/ie/alertmanager/api_token.txt:/etc/alertmanager/api_token.txt:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://${HOST_IP:-localhost}:9093'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # GRAFANA
  # ============================================
  grafana-ntt:
    image: grafana/grafana:13.1.0-25027462778
    container_name: grafana-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - monitoring-net

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://${HOST_IP:-localhost}:3000
      - GF_SERVE_FROM_SUB_PATH=false
      - AP_DATA_DB=${AP_DATA_DB}
      - AP_DATA_USER=${AP_DATA_USER}
      - AP_DATA_PASSWORD=${AP_DATA_PASSWORD}
      - TELEGRAF_PG_DB=${TELEGRAF_PG_DB}
      - TELEGRAF_PG_USER=${TELEGRAF_PG_USER}
      - TELEGRAF_PG_PASSWORD=${TELEGRAF_PG_PASSWORD}
    volumes:
      - /opt/ie/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - /opt/ie/grafana/datasources/activepieces-data.yml:/etc/grafana/provisioning/datasources/activepieces-data.yml:ro
      - /opt/ie/grafana/datasources/telegraf-data.yml:/etc/grafana/provisioning/datasources/telegraf-data.yml:ro
#      - /opt/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - grafana-storage:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      prometheus-ntt:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # NETBOX WITH DEPENDENCIES
  # ============================================
  netbox-postgres-ntt:
    image: postgres:17.9
    container_name: netbox-postgres-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - monitoring-net
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${NETBOX_DB_PASSWORD}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  netbox-redis-ntt:
    image: redis:8.6.2
    container_name: netbox-redis-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  netbox-ntt:
    image: hishaam02/netbox-lists:v4.6-5.0.0
    container_name: netbox-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - monitoring-net

    depends_on:
      netbox-postgres-ntt:
        condition: service_healthy
      netbox-redis-ntt:
        condition: service_healthy
    environment:
      - DB_HOST=netbox-postgres-ntt
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis-ntt
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DATABASE=0
      - REDIS_CACHE_HOST=netbox-redis-ntt
      - REDIS_CACHE_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CACHE_DATABASE=1
      - SECRET_KEY=${NETBOX_SECRET_KEY}
      - SUPERUSER_EMAIL=${NETBOX_SUPERUSER_EMAIL}
      - SUPERUSER_NAME=${NETBOX_SUPERUSER_NAME}
      - SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD}
      - ALLOWED_HOSTS=${HOST_IP:-localhost} ${HOST_USER:-monserver01} netbox-ntt
      - CSRF_TRUSTED_ORIGINS=https://${HOST_IP:-localhost}:8080
    volumes:
      - netbox-media-data:/opt/netbox/netbox/media
      - netbox-reports-data:/opt/netbox/netbox/reports
      - netbox-scripts-data:/opt/netbox/netbox/scripts
      - /opt/ie/netbox/extra.py:/etc/netbox/config/extra.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  netbox-worker-ntt:
    image: hishaam02/netbox-lists:v4.6-5.0.0
    container_name: netbox-worker-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    depends_on:
      netbox-ntt:
        condition: service_healthy
    environment:
      # Same environment variables as netbox-ntt
      - DB_HOST=netbox-postgres-ntt
      - DB_NAME=${POSTGRES_DB_NAME} 
      - DB_USER=${POSTGRES_USER}     
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis-ntt
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${NETBOX_SECRET_KEY}
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker
    volumes:
      - netbox-media-data:/opt/netbox/netbox/media
    healthcheck:
      test: ["CMD-SHELL", "/opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqstats > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3  

  netbox-housekeeping-ntt:
    image: hishaam02/netbox-lists:v4.6-5.0.0
    container_name: netbox-housekeeping-ntt
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    depends_on:
      netbox-ntt:
        condition: service_healthy
    environment:
      - DB_HOST=netbox-postgres-ntt
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis-ntt
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${NETBOX_SECRET_KEY}
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py housekeeping
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # ACTIVEPIECES DEPENDENCIES
  # ============================================
  shared-postgres-ntt:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: shared-postgres-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - monitoring-net
    environment:
      - POSTGRES_DB=${AP_POSTGRES_DATABASE}
      - POSTGRES_USER=${AP_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
      - AP_DATA_DB=${AP_DATA_DB}
      - AP_DATA_USER=${AP_DATA_USER}
      - AP_DATA_PASSWORD=${AP_DATA_PASSWORD}
      - TELEGRAF_PG_DB=${TELEGRAF_PG_DB}
      - TELEGRAF_PG_USER=${TELEGRAF_PG_USER}
      - TELEGRAF_PG_PASSWORD=${TELEGRAF_PG_PASSWORD}
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data
      - /opt/ie/dockering/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================
  # ACTIVEPIECES (Workflow Automation)
  # ============================================
  activepieces-redis-ntt:
    image: redis:8.6.2
    container_name: activepieces-redis-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    command: redis-server --requirepass ${AP_REDIS_PASSWORD}
    volumes:
      - activepieces-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$AP_REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  activepieces-ntt:
    image: ghcr.io/activepieces/activepieces:0.88.1
    container_name: activepieces-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    depends_on:
      shared-postgres-ntt:
        condition: service_healthy
      activepieces-redis-ntt:
        condition: service_healthy
    environment:
      - AP_CONTAINER_TYPE=APP
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${AP_JWT_SECRET}
      - AP_ENVIRONMENT=prod
      - AP_FRONTEND_URL=https://${HOST_IP:-localhost}:5678
      - AP_WEBHOOK_URL=https://${HOST_IP:-localhost}:5678
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE}
      - AP_POSTGRES_HOST=shared-postgres-ntt
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
      - AP_EXECUTION_MODE=UNSANDBOXED
      - AP_REDIS_HOST=activepieces-redis-ntt
      - AP_REDIS_PORT=6379
      - AP_REDIS_PASSWORD=${AP_REDIS_PASSWORD}
      - AP_FLOW_TIMEOUT_SECONDS=600
      - AP_TELEMETRY_ENABLED=false
      - AP_TEMPLATES_SOURCE_URL=https://cloud.activepieces.com/api/v1/flow-templates
    volumes:
      - activepieces-cache:/usr/src/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  activepieces-worker-ntt:
    image: ghcr.io/activepieces/activepieces:0.88.1
    container_name: activepieces-worker-ntt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - monitoring-net
    depends_on:
      shared-postgres-ntt:
        condition: service_healthy
      activepieces-redis-ntt:
        condition: service_healthy
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${AP_JWT_SECRET}
      - AP_ENVIRONMENT=prod
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE}
      - AP_POSTGRES_HOST=shared-postgres-ntt
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
      - AP_REDIS_HOST=activepieces-redis-ntt
      - AP_REDIS_PORT=6379
      - AP_REDIS_PASSWORD=${AP_REDIS_PASSWORD}
      - AP_FLOW_TIMEOUT_SECONDS=600
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_EXECUTION_MODE=UNSANDBOXED
    volumes:
      - activepieces-cache:/usr/src/app/cache
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
