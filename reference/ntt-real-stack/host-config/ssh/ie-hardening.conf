# Insights Engine Network Monitoring Platform — SSH Hardening
# Per Section 7 of Security Architecture Document

# Password authentication disabled — key-based only
PasswordAuthentication no

# Root login disabled
PermitRootLogin no

# Restrict to the deployment user (AllowUsers is auto-set by deploy_monitoring_stack.py
# to match the actual deploy user, e.g. monserver01, monserver02, etc.)
# TEMPLATE ONLY — the live config is generated at /etc/ssh/sshd_config.d/ie-hardening.conf
AllowUsers {{DEPLOY_USER}}

# Reduce brute-force exposure
MaxAuthTries 3
LoginGraceTime 30

# Modern key types only
PubkeyAcceptedKeyTypes ssh-ed25519,rsa-sha2-512,rsa-sha2-256
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Disable X11 forwarding (not needed on a server)
X11Forwarding no
