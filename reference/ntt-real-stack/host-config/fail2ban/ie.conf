# Insights Engine Network Monitoring Platform — Fail2Ban Configuration
# Per Section 6.8 of Security Architecture Document

[DEFAULT]
bantime = 3600
findtime = 600
maxretry = 3
backend = systemd

# SSH jail
[sshd]
enabled = true
port = ssh
logpath = %(sshd_log)s
maxretry = 3
bantime = 3600

# Caddy jail — monitor for repeated 401/403 responses (brute-force pattern)
[caddy-auth]
enabled = true
port = http,https
logpath = /opt/ie/caddy/data/*_access.log
          /opt/ie/caddy/data/access.log
maxretry = 5
findtime = 300
bantime = 3600
filter = caddy-auth
