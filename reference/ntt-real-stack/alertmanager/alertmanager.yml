global:
  resolve_timeout: 5m

route:
  receiver: 'ie-prometheus-webhook'
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 15m

receivers:
  - name: 'ie-prometheus-webhook'
    webhook_configs:
      - url: 'https://<insights-engine-core>.<domain>/iecore/post/prometheus_alerts_<CLIENT>'
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/api_token.txt
