  fortigate_bandwidth:
    # FortiGate estimated in/out bandwidth statements (kbps) per interface.
    # Matches 'set estimated-upstream/downstream-bandwidth' / inbandwidth.
    # OID tree: 1.3.6.1.4.1.12356.101.7.2.1.1.<in|out>.<ifIndex>
    #   .2 = inbound (upstream)   .3 = outbound (downstream)
    # Indexed by the SAME ifIndex as IF-MIB, so we join to ifAlias/ifDescr
    # and can alert by alias (e.g. alias=bb1).
    walk:
    - 1.3.6.1.4.1.12356.101.7.2.1.1.2      # fgSysIfInEstimatedBandwidth
    - 1.3.6.1.4.1.12356.101.7.2.1.1.3      # fgSysIfOutEstimatedBandwidth
    metrics:
    - name: fortigate_if_in_bw_kbps
      oid: 1.3.6.1.4.1.12356.101.7.2.1.1.2
      type: gauge
      help: FortiGate estimated inbound bandwidth statement (kbps) per interface
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels:
        - ifIndex
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels:
        - ifIndex
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
