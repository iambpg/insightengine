        refresh_interval: 6m
        authorization:
          type: Token
          credentials_file: /etc/prometheus/netbox.token
    relabel_configs:
      # Use primary IPv4 as the target for SNMP
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance

      # Keep the device name as instance label
      - source_labels: [__meta_netbox_name]
        target_label: hostname

      # Add useful metadata as labels
      - source_labels: [__meta_netbox_site_name]
        target_label: site
      - source_labels: [__meta_netbox_role]
        target_label: device_role
      - source_labels: [__meta_netbox_device_type]
        target_label: model
      - source_labels: [__meta_netbox_region]
        target_label: region
      - source_labels: [__meta_netbox_primary_ip4]
        target_label: ipv4
      - source_labels: [__meta_netbox_tenant]
        target_label: business_unit
      - source_labels: [__meta_netbox_site_group]
        target_label: site_type

      # Target the Blackbox Exporter
      - target_label: __address__
        replacement: blackbox-exporter-ntt:9115

  # Distribution Switches (DSW) 
  - job_name: 'icmp-distribution-switches'
    scrape_interval: 10s
    scrape_timeout: 7s
    metrics_path: /probe
    params:
      module: [icmp]
