    scrape_timeout: 4m
    metrics_path: /snmp

    params:
      module: [cisco_wlc_universal]
      auth: [ie_wlc_v2]

    http_sd_configs:
      - url: http://netbox-ntt:8080/api/plugins/lists/prometheus-devices/?status=active&role=wireless-controller
