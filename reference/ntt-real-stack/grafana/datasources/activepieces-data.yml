apiVersion: 1

datasources:
  - name: Activepieces Data
    type: postgres
    access: proxy
    url: shared-postgres-ntt:5432
    database: ${AP_DATA_DB}
    user: ${AP_DATA_USER}
    secureJsonData:
      password: ${AP_DATA_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1400
    isDefault: false
    editable: false
