[global_tags]
  environment = "production"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "10ms"
  hostname = "Telegraf"
  omit_hostname = false

[[outputs.prometheus_client]]
  listen = ":9273"
  read_timeout = "10s"
  write_timeout = "10s"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"
  string_as_label = true
  export_timestamp = true

# Write metrics to PostgreSQL (telegraf_data) for Grafana visualisation.
# Data is written to a table matching each measurement name.
# https://github.com/influxdata/telegraf/tree/master/plugins/outputs/postgresql
[[outputs.postgresql]]
  connection = "postgres://${TELEGRAF_PG_USER}:${TELEGRAF_PG_PASSWORD}@shared-postgres-ntt:5432/${TELEGRAF_PG_DB}?sslmode=disable"
  # Write each metric series as one row.  Columns: time, plus one per tag and field.
  timestamp_column_name = "time"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################


[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  fielddrop = ["time_*"]
  core_tags = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  
[[inputs.diskio]]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.system]]

[[inputs.net]]
  interfaces = ["eth*", "ens*", "eno*"]

[[inputs.netstat]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"

###############################################################################
#                  FORTIGATE WAN INTERFACE TELEMETRY (API)                    #
###############################################################################
# Pulls two things from each FortiGate via its REST API:
#   1. cmdb/system/interface  -> inbandwidth/outbandwidth  (the kbps commitment)
#   2. monitor/system/interface -> rx_bytes/tx_bytes       (live byte counters)
# Telegraf egresses via the host (203.0.113.10) which is in the FW trusthost.
# The API key below is a placeholder - substitute ${FORTIGATE_API_TOKEN}.
# NOTE: use the specific FQ: one [[inputs.http]] per FortiGate, or per job.

# --- 1. Bandwidth statement (cmdb returns results as an ARRAY) -------------
# lan4 is at array index 6 on this FortiGate - adjust index per-device/interface.
[[inputs.http]]
  urls = ["https://10.20.20.1:10443/api/v2/cmdb/system/interface"]
  interval = "60s"
  method = "GET"
  data_format = "json_v2"
  insecure_skip_verify = true
  tagexclude = ["url"]
  [inputs.http.headers]
    Authorization = "Bearer ${FORTIGATE_API_TOKEN}"

  [[inputs.http.json_v2]]
    measurement_name = "fortigate_bw"
    [[inputs.http.json_v2.field]]
      rename = "ifname"
      path = "results.6.name"
      type = "string"
    [[inputs.http.json_v2.field]]
      rename = "in_bw_kbps"
      path = "results.6.inbandwidth"
      type = "float"
    [[inputs.http.json_v2.field]]
      rename = "out_bw_kbps"
      path = "results.6.outbandwidth"
      type = "float"

# --- 2. Byte counters (monitor returns results as an OBJECT keyed by name) --
[[inputs.http]]
  urls = ["https://10.20.20.1:10443/api/v2/monitor/system/interface"]
  interval = "60s"
  method = "GET"
  data_format = "json_v2"
  insecure_skip_verify = true
  tagexclude = ["url"]
  [inputs.http.headers]
    Authorization = "Bearer ${FORTIGATE_API_TOKEN}"

  [[inputs.http.json_v2]]
    measurement_name = "fortigate_mon"
    [[inputs.http.json_v2.field]]
      rename = "ifname"
      path = "results.lan4.name"
      type = "string"
    [[inputs.http.json_v2.field]]
      rename = "rx_bytes"
      path = "results.lan4.rx_bytes"
      type = "float"
    [[inputs.http.json_v2.field]]
      rename = "tx_bytes"
      path = "results.lan4.tx_bytes"
      type = "float"
    [[inputs.http.json_v2.field]]
      rename = "speed"
      path = "results.lan4.speed"
      type = "float"
