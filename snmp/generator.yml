# Starter generator input for Cisco, Fortinet and Palo Alto.
# The live snmp/out/snmp.yml is the generated file from the real stack (auths use
# ${SNMP_*} so no community or password is stored). Running this generator needs
# the vendor MIBs in snmp/mibs and replaces nothing until you save the candidate
# from Settings. Walks below are the standard MIB names the real modules are
# built from; vendor-only tables appear once those MIBs are uploaded.
auths:
  ntt_snmpv3_auth:
    version: 3
    security_level: authPriv
    username: ${SNMP_V3_USERNAME}
    password: ${SNMP_V3_AUTH_PASSWORD}
    auth_protocol: SHA256
    priv_protocol: AES256
    priv_password: ${SNMP_V3_PRIV_PASSWORD}
  ie_snmp_v2:
    version: 2
    community: ${SNMP_V2_COMMUNITY}
  ie_wlc_v2:
    version: 2
    community: ${SNMP_V2_COMMUNITY}

modules:
  # Cisco switches (IF-MIB + the Cisco entity/memory tables once CISCO-* MIBs are present).
  if_mib:
    walk: [sysUpTime, interfaces, ifXTable]
  system:
    walk: [system]
  cisco_environ:
    walk: [ciscoEnvMonTemperatureStatusTable, ciscoEnvMonFanStatusTable, ciscoEnvMonSupplyStatusTable]
  cisco_mem:
    walk: [ciscoMemoryPoolTable]
  cisco_pro:
    walk: [cpmCPUTotalTable]
  # CDP neighbours. Index is cdpCacheIfIndex (the IF-MIB ifIndex) plus cdpCacheDeviceIndex.
  cisco_cdp:
    walk:
      - cdpCacheDeviceId
      - cdpCacheDevicePort
      - cdpCacheAddress
      - cdpCachePlatform
    overrides:
      cdpCacheAddress:
        type: OctetString
  # LLDP neighbours. lldpRemManAddr is an index of lldpRemManAddrIfId.
  lldp:
    walk:
      - lldpRemSysName
      - lldpRemPortId
      - lldpRemPortDesc
      - lldpRemManAddrIfId
      - lldpLocPortId
    overrides:
      lldpRemPortId:
        type: DisplayString
      lldpLocPortId:
        type: DisplayString
  cisco_wlc_universal:
    walk: [bsnAPTable, bsnApIfTable]
  # Fortinet. FORTINET-FORTIGATE-MIB / FORTINET-CORE-MIB must be in snmp/mibs.
  # FortiOS leaves ifDescr empty. The interface name (wan1, internal1, dmz) is ifName.
  if_mib_fortigate:
    walk: [sysUpTime, ifTable, ifXTable, ifName, ifHighSpeed]
  fortigate:
    walk: [fgSystemInfo, fgHwSensors]
  fortigate_bandwidth:
    walk: [fgIntfVlanTable, ifName]
  fortigate_est_bandwidth:
    walk: [fgVpnTunTable]
  # Palo Alto. PAN-COMMON-MIB must be uploaded before this module will generate.
  paloalto_system:
    walk: [panSys]

  # Health modules. Source of truth also in generator-health.yml.
  # A full generator run rewrites snmp/out/snmp.yml; merge new modules
  # instead of replacing if_mib, cisco_cdp, lldp and cisco_wlc_universal.
  # Lookup-rich CISCO-ENVMON. The live module cisco_environ stays so existing
  # jobs that name it keep working. New platform lists use cisco_env.
  cisco_env:
    walk:
      - ciscoEnvMonTemperatureStatusDescr
      - ciscoEnvMonTemperatureStatusValue
      - ciscoEnvMonTemperatureStatusValueRev1
      - ciscoEnvMonTemperatureState
      - ciscoEnvMonFanStatusDescr
      - ciscoEnvMonFanState
      - ciscoEnvMonSupplyStatusDescr
      - ciscoEnvMonSupplyState
      - ciscoEnvMonSupplySource
    lookups:
      - source_indexes: [ciscoEnvMonTemperatureStatusIndex]
        lookup: ciscoEnvMonTemperatureStatusDescr
        drop_source_indexes: false
      - source_indexes: [ciscoEnvMonFanStatusIndex]
        lookup: ciscoEnvMonFanStatusDescr
        drop_source_indexes: false
      - source_indexes: [ciscoEnvMonSupplyStatusIndex]
        lookup: ciscoEnvMonSupplyStatusDescr
        drop_source_indexes: false

  # IOS-XE / NX-OS / 9800 memory. Indexed by entPhysicalIndex + cempMemPoolIndex.
  cisco_enhanced_mem:
    walk:
      - cempMemPoolName
      - cempMemPoolUsed
      - cempMemPoolFree
      - cempMemPoolHCUsed
      - cempMemPoolHCFree
    lookups:
      - source_indexes: [entPhysicalIndex, cempMemPoolIndex]
        lookup: cempMemPoolName
        drop_source_indexes: false

  # Temperature (and other sensors) on IOS-XE, NX-OS and Catalyst 9800.
  cisco_entity_sensor:
    walk:
      - entSensorType
      - entSensorScale
      - entSensorPrecision
      - entSensorValue
      - entSensorStatus
    lookups:
      - source_indexes: [entPhysicalIndex]
        lookup: entPhysicalName
        drop_source_indexes: false
      - source_indexes: [entPhysicalIndex]
        lookup: entPhysicalDescr
        drop_source_indexes: false

  # Fan trays and FRU power supplies. Names come from ENTITY-MIB.
  cisco_fru:
    walk:
      - cefcFRUPowerOperStatus
      - cefcFanTrayOperStatus
    lookups:
      - source_indexes: [entPhysicalIndex]
        lookup: entPhysicalName
        drop_source_indexes: false

  # FortiGate sensors. fgSysMemUsage is also here so the module stands alone.
  # The committed fortigate module already exports that scalar; the merge step
  # drops it from fortinet_health when both would be scraped together.
  fortinet_health:
    walk:
      - fgHwSensorEntName
      - fgHwSensorEntValue
      - fgHwSensorEntAlarmStatus
      - fgSysMemUsage
      - fgSysMemCapacity
    lookups:
      - source_indexes: [fgHwSensorEntIndex]
        lookup: fgHwSensorEntName
        drop_source_indexes: false
    overrides:
      fgHwSensorEntValue:
        regex_extracts:
          Number:
            - regex: '([-+]?[0-9]*\.?[0-9]+)'
              value: '$1'

  # Palo Alto memory (HOST-RESOURCES), temperature/fan/PSU (ENTITY-SENSOR) and
  # FRU power tables (PAN-ENTITY-EXT). entPhysicalName labels the sensors.
  paloalto_health:
    walk:
      - hrStorageDescr
      - hrStorageAllocationUnits
      - hrStorageSize
      - hrStorageUsed
      - entPhySensorType
      - entPhySensorScale
      - entPhySensorPrecision
      - entPhySensorValue
      - entPhySensorOperStatus
      - panEntryFanTrayPowerUsed
      - panEntryPowerSupplyPowerCapacity
    lookups:
      - source_indexes: [hrStorageIndex]
        lookup: hrStorageDescr
        drop_source_indexes: false
      - source_indexes: [entPhysicalIndex]
        lookup: entPhysicalName
        drop_source_indexes: false
      - source_indexes: [entPhysicalIndex]
        lookup: entPhysicalDescr
        drop_source_indexes: false

  # AireOS controller system stats and WLC-level counts. No AP table and no
  # client table: per-AP rows are Telegraf, client RSSI is 9800 MDT.
  # bsnGlobalDot11SystemMobileStations is the client total.
  # HA scalars (cRFStatusUnitState) are numeric in snmp/out/snmp.yml because
  # CISCO-RF-MIB is not vendored for the generator.
  cisco_wlc_aireos:
    walk:
      - agentCurrentCPUUtilization
      - agentTotalMemory
      - agentFreeMemory
      - agentSwitchInfoPowerSupply1Present
      - agentSwitchInfoPowerSupply1Operational
      - agentSwitchInfoPowerSupply2Present
      - agentSwitchInfoPowerSupply2Operational
      - agentRadioUpDownTrapCount
      - agentApAssociateDisassociateTrapCount
      - bsnGlobalDot11SystemMobileStations

  # Catalyst 9800 controller summary. Joined APs and total clients are scalars.
  # CPU, memory, fans, PSUs and temperature come from cisco_pro,
  # cisco_enhanced_mem, cisco_entity_sensor and cisco_fru on the same scrape.
  # Per-AP and per-client tables are not walked (a single 9800 can hold ~5000 APs).
  cisco_wlc_iosxe:
    walk:
      - cLApGlobalAPConnectCount
      - cLMobilityExtMCTotalClientCount

  # Scalar only. Do not fold this into if_mib: the system module already
  # exports sysUpTime, and a combined scrape must not publish it twice.
  uptime:
    walk: [sysUpTime]
